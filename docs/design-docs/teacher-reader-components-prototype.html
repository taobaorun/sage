 if(t.closest("#demo-wrap")){sourceWrap=!sourceWrap;$("demo-source-scroll").classList.toggle("wrap",sourceWrap);$("demo-wrap").setAttribute("aria-pressed",String(sourceWrap));return;}
 if(t.closest("#demo-copy"))copyCurrentSource();
});


const QA_KEY="teacher-components.qa.v1";
let qaStore={};
try{const data=JSON.parse(localStorage.getItem(QA_KEY)||"{}");if(data&&typeof data==="object")qaStore=data;}catch(error){}
function qaState(index){
 let q=qaStore[index];
 if(!q||typeof q!=="object")q=qaStore[index]={answer:null,answers:[],checked:false,text:"",draft:"",hint:0,skipped:false};
 if(!Array.isArray(q.answers))q.answers=[];
 if(typeof q.text!=="string")q.text="";if(typeof q.draft!=="string")q.draft=q.text;
 q.hint=Math.max(0,Math.min(2,Number(q.hint)||0));q.checked=Boolean(q.checked);return q;
}
function saveQA(){try{localStorage.setItem(QA_KEY,JSON.stringify(qaStore));return true;}catch(error){return false;}}
function qaDefinition(){
 if(currentCase===1)return {title:"第二次仍然查 42，哪些工作仍会发生？",multiple:true,options:[["enter","进入 getBook"],["key","组成 book:42"],["check","检查缓存是否存在"],["load","再次调用 findBook"]],correct:["enter","key","check"]};
 if(currentCase===3)return {title:"开始时已有 book:42，这次会新增几次 findBook 调用？",options:[["zero","0 次"],["one","1 次"],["all","不能复用，必须重新取数"]],correct:"zero"};
 return {title:"已经查过 42，现在第一次查 17，会走哪条路？",options:[["wrong","直接返回书籍 42 的副本"],["load","先查缓存；没有 17 就取数并保存"],["forever","自动得到所有书籍的最新数据"]],correct:"load"};
}
function qaBody(){
 const q=qaState(currentCase),p="qa-case-"+currentCase;
 if(q.skipped)return '<div class="skipped-question"><p class="source-state-label">这道问题已暂留</p><h3>继续读：缓存也有维护成本</h3><p class="reader-copy">可以先理解副本为什么会过期，再回来核对刚才的判断。跳过不会被记成答对，也不阻止阅读。</p><button class="sample-button" data-qa-return>回到刚才的问题</button></div>';
 if(currentCase===2)return '<label class="textarea-label" for="'+p+'-text">用自己的话解释：缓存到底省掉了什么，仍然要做什么？</label><textarea id="'+p+'-text" data-qa-text placeholder="先写自己的理解，再选择是否看提示。">'+esc(q.draft||q.text)+'</textarea><div class="sample-actions"><button class="sample-button primary" data-qa-save-text>保存这段解释</button><button class="sample-button" data-qa-hint '+(q.hint>=2?"disabled":"")+'>'+(q.hint===0?"给一点提示":q.hint===1?"再看一个提示":"提示已展开")+'</button><button class="sample-button secondary" data-qa-reset>清空这题</button></div><ol class="qa-hints" id="qa-hints">'+(q.hint>0?'<li>先列出两次查询都会做的动作。</li>':"")+(q.hint>1?'<li>再比较 findBook 在两次请求中是否都会执行。</li>':"")+'</ol><p class="qa-hint-line" id="qa-text-status">离线样本不会自动评判自由文本是否正确。</p><details><summary>按需查看参考表达</summary><p>命中缓存后仍然进入 getBook、生成键并检查缓存，但可以跳过 findBook。缓存复用的是结果，没有让原始取数本身变快。</p></details>';
 const d=qaDefinition();
 const prediction=currentCase===3?'<p class="footnote">已知前提：当前缓存中已有可用的 book:42。本例不考虑过期。</p><pre>'+esc('if (entries.has("book:42")) {\n  return entries.get("book:42");\n}\nconst value = await load();')+'</pre>':"";
 return prediction+'<fieldset><legend>'+d.title+'</legend>'+d.options.map(function(option,i){const selected=d.multiple?q.answers.includes(option[0]):q.answer===option[0];return '<label class="qa-choice"><input type="'+(d.multiple?"checkbox":"radio")+'" name="'+p+'" value="'+option[0]+'" data-qa-option="'+option[0]+'" '+(selected?"checked":"")+'><span><small>'+String.fromCharCode(65+i)+'</small>'+option[1]+'</span></label>';}).join("")+'</fieldset><div class="sample-actions"><button class="sample-button primary" data-qa-check>核对思路</button><button class="sample-button secondary" data-qa-reset>重新想一遍</button><button class="sample-button secondary" data-qa-skip>先跳过，继续读</button></div><p class="qa-hint-line" id="qa-selection-status"></p><div id="qa-result" role="status" aria-live="polite"></div>';
}
function qaResult(){
 if(currentComponent!=="qa"||!$("qa-example")||currentCase===2)return;
 const q=qaState(currentCase);if(q.skipped)return;const d=qaDefinition(),selected=d.multiple?q.answers.length>0:Boolean(q.answer),check=$("qa-example").querySelector("[data-qa-check]");
 check.disabled=!selected||q.checked;check.textContent=q.checked?"已核对":"核对思路";
 $("qa-selection-status").textContent=!selected?(d.multiple?"可选择多项，再核对。":"先表达判断，选择后不会立即揭示答案。"):q.checked?"核对只反馈本题思路，不代表已经掌握主题。":"已保留你的选择；准备好后再核对。";
 if(!q.checked){$("qa-result").innerHTML="";return;}
 const correct=d.multiple?q.answers.length===d.correct.length&&d.correct.every(function(v){return q.answers.includes(v);}):q.answer===d.correct;
 let reason=currentCase===1?"两次请求都要进入函数、组成键并检查缓存。命中时省掉的是再次调用 findBook，而不是所有工作。":currentCase===3?"已有副本时函数在 if 分支里返回，后面的 load 不执行，因此新增 0 次 findBook 调用。":"book:17 与 book:42 是两个键。42 的副本不能回答 17；没有 17 的副本时需要取数，再保存结果。";
 $("qa-result").innerHTML='<div class="qa-output"><strong>'+(correct?"✓ 这条思路对上了":"再看一个关键判断")+'</strong>'+reason+(currentCase===3?'<details class="prediction-evidence"><summary>看预设的路径证据</summary><ol><li>entries.has 返回 true。</li><li>从已有副本直接 return。</li><li>没有到达 load 那一行。</li></ol><p class="footnote">这是基于题目已知前提的预设说明，不是实际运行日志。</p></details>':"")+'</div>';
}
function renderQA(){
 const titles=["先选择，再核对","多个动作可以同时成立","表达自己的理解，不交给假评分","根据已知前提预测路径","跳过以后，怎样回来"];
 const controls=currentCase===4?'<div class="design-controls"><span class="control-label">设计控制 · 恢复后的三种状态</span><button data-qa-preset="empty">尚未作答</button><button data-qa-preset="pending">已选未核对</button><button data-qa-preset="checked">已核对后返回</button></div>':"";
 const notes=[
 ["需要核对一个明确判断时。","先选一个答案，再主动核对；可以重新选择或暂时跳过。","选择阶段不揭示结果；核对后解释关键差异。","原生单选组支持方向键；旧选择可以恢复，但不凭空认定已掌握。","只选择而未核对时，看不到正确/错误结论。"],
 ["问题允许多个同时成立的条件时。","逐项勾选，再比较哪些是命中时仍需完成的工作。","明确提示可多选，并解释遗漏或多选的共同原因。","复选框可独立操作；不能把“部分勾中”误报为全部正确。","把函数入口、键生成和缓存判断与重复取数区分开。"],
 ["需要读者组织自己的解释时。","写下想法，按需看逐层提示，再对照参考表达。","只保存文本和提供参考，不模拟语义判分。","文本只在本浏览器保存；提示不会替读者填写答案，移动端可直接输入。","不会出现“AI已判断理解正确”或未经证实的掌握分数。"],
 ["需要把代码分支和预测联系起来时。","先看明确前提和短代码，再预测执行到哪一行。","核对后给出预设的逐步证据，并标清不是运行记录。","代码只作为文字；键盘选择和核对分开。","结论能从题目给定的缓存状态推出，而非编造运行值。"],
 ["读者暂时跳过、重访或刷新恢复练习时。","跳过后继续读另一段；再回来保留本题选择。","保留选过/核对过的区别；不以跳过阻塞阅读。","恢复状态仅在工作台自己的键中保存，不改动课程进度。","未核对的旧选择仍然是待核对，不自动显示正确结论。"]
 ][currentCase];
 setTimeout(qaResult,0);
 return sampleHTML(titles[currentCase],controls+'<div class="qa-workshop" id="qa-example">'+qaBody()+'</div>',notes);
}
RENDERERS.qa=renderQA;
function rebuildQA(){if($("qa-example")){$("qa-example").innerHTML=qaBody();qaResult();}}
document.addEventListener("change",function(e){if(currentComponent!=="qa"||!(e.target instanceof HTMLInputElement)||!e.target.matches("[data-qa-option]"))return;const q=qaState(currentCase);if(qaDefinition().multiple)q.answers=Array.from($("qa-example").querySelectorAll("input:checked")).map(function(input){return input.value;});else q.answer=e.target.value;q.checked=false;saveQA();qaResult();});
document.addEventListener("input",function(e){if(currentComponent==="qa"&&e.target.matches("[data-qa-text]"))qaState(currentCase).draft=e.target.value;});
document.addEventListener("click",function(e){
 const t=e.target instanceof Element?e.target:null;if(!t||currentComponent!=="qa")return;const q=qaState(currentCase);
 const preset=t.closest("[data-qa-preset]");if(preset){q.answer=preset.dataset.qaPreset==="empty"?null:"load";q.checked=preset.dataset.qaPreset==="checked";q.skipped=false;saveQA();rebuildQA();return;}
 if(t.closest("[data-qa-check]")){q.checked=true;saveQA();qaResult();return;}
 if(t.closest("[data-qa-reset]")){qaStore[currentCase]={answer:null,answers:[],checked:false,text:"",draft:"",hint:0,skipped:false};saveQA();rebuildQA();const input=$("qa-example").querySelector("input,textarea");if(input)input.focus({preventScroll:true});return;}
 if(t.closest("[data-qa-skip]")){q.skipped=true;saveQA();rebuildQA();return;}
 if(t.closest("[data-qa-return]")){q.skipped=false;saveQA();rebuildQA();return;}
 if(t.closest("[data-qa-save-text]")){q.text=q.draft;const ok=saveQA();$("qa-text-status").textContent=ok?"已保存在当前浏览器；内容未被自动评判。":"这次无法保存；文本仍可在当前页面继续编辑。";return;}
 if(t.closest("[data-qa-hint]")){q.hint=Math.min(2,q.hint+1);saveQA();rebuildQA();}
});

/* component implementations */
document.addEventListener("click",function(e){const t=e.target instanceof Element?e.target:null;if(!t)return;const nav=t.closest("[data-component]");if(nav){chooseComponent(nav.dataset.component);return;}const c=t.closest("[data-case]");if(c){chooseCase(Number(c.dataset.case));return;}});
$("mobile-nav").addEventListener("change",function(e){chooseComponent(e.target.value);});
render();
</script></body></html>
